[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-news"
version = "0.1.0"
description = "Obsidian ingestion engine for financial news summaries stored in Postgres"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4,<12",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
financial-news-ingest = "financial_news.ingest:main"
financial-news-graph = "financial_news.graph_metrics:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
